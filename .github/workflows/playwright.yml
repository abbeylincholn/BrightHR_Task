name: Playwright Tests (Docker)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Quick sanity check so we fail fast if lockfile is out of sync
      - name: Verify lockfile matches package.json
        run: |
          npm ci --ignore-scripts
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t brighthr-tests:ci .

      # Run tests in the container, but don't fail the step; capture exit code.
      - name: Run Playwright tests in Docker
        id: run_tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/playwright-report"
          set +e
          docker run --rm \
            --ipc=host --shm-size=1g \
            -v "$GITHUB_WORKSPACE/playwright-report:/app/playwright-report" \
            brighthr-tests:ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          # Always succeed here so we can upload the report
          exit 0

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Re-emit the original test exit code so the job status is correct
      - name: Fail if tests failed
        if: always()
        run: |
          code="${{ steps.run_tests.outputs.exit_code || 0 }}"
          echo "Playwright exit code: $code"
          if [ "$code" -ne 0 ]; then exit "$code"; fi
